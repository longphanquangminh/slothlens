[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slothlens"
version = "0.1.0"
description = "A sloth that eats your screenshots while you sleep. Local, slow, private: Gemma 3 via Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Pillow>=9"]
keywords = ["screenshots", "ollama", "gemma", "local-ai", "privacy", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.optional-dependencies]
gates = ["psutil>=5.9"]   # precise battery + CPU checks
demo = ["playwright>=1.40"]

[project.scripts]
slothlens = "slothlens.cli:main"

[tool.setuptools]
packages = ["slothlens"]
